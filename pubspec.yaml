name: BetterMe
description: A new Flutter application.
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.3.1 <4.0.0'



dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  get: ^4.6.5                           # GetX - State Management, Navigation, DI
  
  # UI & Design
  google_nav_bar: ^5.0.6                # Bottom navigation bar
  animated_notch_bottom_bar: ^1.0.0     # Notched bottom bar
  lottie: ^2.6.0                        # Lottie animations
  flutter_svg: ^1.0.0                   # SVG support
  sizer: ^2.0.15                        # Responsive design
  cupertino_icons: ^1.0.2               # iOS style icons
  
  # Data & Storage
  shared_preferences: ^2.2.2            # Local storage
  json_annotation: ^4.8.1               # JSON serialization annotations
  
  # Notifications & Services
  flutter_local_notifications: ^14.1.1  # Local notifications
  connectivity_plus: ^5.0.2             # Connectivity checking
  
  # Utilities
  table_calendar: ^3.0.9                # Calendar widget
  timezone: ^0.9.2                      # Timezone management
  dartz: ^0.10.1                        # Functional programming utilities
  intl: ^0.19.0                         # Internationalization & Localization
  awesome_dialog: ^3.0.2                # Dialog widgets
  bot_toast: ^4.0.2                     # Toast notifications
  flutter_spinkit: ^5.2.0               # Loading spinners

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0                 # Lint rules
  flutter_native_splash: ^2.3.0         # Native splash screen
  flutter_launcher_icons: ^0.13.1       # App launcher icons
  json_serializable: ^6.7.1             # JSON code generation
  build_runner: ^2.4.8                  # Code generator runner
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/ic_logo2.jpg"
flutter_native_splash:
  color: "#FFFFFF"
  image: "images/ic_logo3.png"
  android_gravity: "center"

flutter:

  uses-material-design: true

  assets:
    - images/
    - images/assets/animations/
    - images/assets/icons/
    - images/assets/sound/

